name: CI & Quality Gate

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  validate:
    name: Lint, Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Check Ruff Linting
        run: uv run ruff check .

      - name: Check Ruff Formatting
        run: uv run ruff format --check .

      - name: Restore DF5120 benchmark cache
        id: benchmark-cache
        uses: actions/cache@v4
        with:
          path: data/benchmark/DF5120
          key: df5120-benchmark-v1

      - name: Fetch benchmark dataset on cache miss
        if: steps.benchmark-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch_benchmark_data.sh

      - name: Run Pytest Suite
        run: uv run pytest
