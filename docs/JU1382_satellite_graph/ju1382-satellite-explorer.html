<script>
const D=JSON.parse(document.getElementById("data").textContent);
const nodes = new Map([...D.nodes,...D.repeats.map(r=>({...r,kind:"group",label:r.id+" · "+r.label}))].map(n=>[n.id,n]));
const arrays=new Map(D.arrays.map(x=>[x.id,x]));
const edges=[...D.homology.map((e,i)=>({...e,id:"h"+i,layer:"homology"})),...D.read_comparisons.map((e,i)=>({...e,id:"r"+i,layer:"read"})),...D.repeats.flatMap(g=>g.sites.map(s=>({source:s,target:g.id,id:g.id+"_"+s,layer:"array"})))];
const svgNS="http://www.w3.org/2000/svg";
const get=id=>document.getElementById(id);
const label=id=>nodes.get(id).label;
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const fmt=x=>Number(x).toLocaleString();
const statuses={germline_supported:"Supported germline cap",provisional_distal_cap:"Provisional distal cap",extended_open:"Extended, open",open_proximal_cap:"Open, proximal tract",alternative:"Separate graph candidate"};
const styles={homology:"Shared aligned block",array:"Tandem array",read:"Competing read placements"};
const stats={supported:D.nodes.filter(n=>n.status==="germline_supported").length,provisional:D.nodes.filter(n=>n.status==="provisional_distal_cap").length,open:D.nodes.filter(n=>n.kind==="end"&&!n.assigned).length};
get("stats").innerHTML="<b>"+stats.supported+"</b> supported · <b>"+stats.provisional+"</b> provisional · <b>"+stats.open+"</b> open";
const pos=new Map();
for(const [i,n] of D.nodes.entries()){
 const loc=i<12?(i%2?390:102):102+(i-12)*288;
 const y=i<12?80+Math.floor(i/2)*74:525;
 pos.set(n.id,{x:loc,y,w:i<12?75:155});
}
for(const [i,n] of D.repeats.entries()) pos.set(n.id,{x:560,y:112+i*(355/Math.max(D.repeats.length-1,1)),w:116});
const select=get("site");
select.append(new Option("Choose a chromosome end",""));
for(const n of nodes.values())select.append(new Option(n.label,n.id));
get("method").textContent="Distances are measured inward from the draft tip. Autocorrelation estimates tandem period and span. Same-period arrays are compared by canonical 15-mers. Long aligned blocks are shown separately.";
let active="",activeEdge="";
function s(tag,attrs,text){
 const node=document.createElementNS(svgNS,tag);
 for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);
 if(text!==undefined)node.textContent=text;
 return node;
}
function connect(e){
 const a=pos.get(e.source),b=pos.get(e.target);
 if(Math.abs(a.x-b.x)<30){
   const off=e.layer==="read"?-75:92;
   return "M"+a.x+","+a.y+" C"+(a.x+off)+","+a.y+" "+(b.x+off)+","+b.y+" "+b.x+","+b.y;
 }
 const sign=Math.sign(b.x-a.x), x=a.x+sign*a.w/2, y=b.x-sign*b.w/2, mid=(x+y)/2;
 return "M"+x+","+a.y+" C"+mid+","+a.y+" "+mid+","+b.y+" "+y+","+b.y;
}
function draw(){
 const svg=get("network");
 svg.replaceChildren();
 for(const [x,y,t] of [[102,32,"5′ ends"],[392,32,"3′ ends"],[558,32,"Tandem groups"]])
  svg.append(s("text",{x,y,"text-anchor":"middle",fill:"#526078","font-size":"14"},t));
 const visible=edges.filter(e=>get(e.layer).checked);
 for(const e of visible){
  const engaged=e.id===activeEdge||e.source===active||e.target===active;
  const c=connect(e);
  svg.append(s("path",{d:c,class:"edge "+e.layer+(engaged?" selected":active?" dim":"")}));
  svg.append(s("path",{d:c,class:"hit",tabindex:"0",role:"button","aria-label":styles[e.layer]+" between "+label(e.source)+" and "+label(e.target),"data-edge":e.id}));
 }
 for(const n of nodes.values()){
  const p=pos.get(n.id);
  const kind=n.status==="provisional_distal_cap"?"provisional":n.assigned?"assigned":n.kind==="group"?"group":n.kind==="graph route"?"alternative":"";
  const activeNeighbor=visible.some(e=>(e.source===n.id&&e.target===active)||(e.source===active&&e.target===n.id));
  const dim=active&&active!==n.id&&!activeNeighbor?" dim":"";
  const g=s("g",{class:"node "+kind+(active===n.id?" selected":"")+dim,role:"button",tabindex:"0","data-node":n.id,"aria-label":n.label});
  g.append(s("rect",{x:p.x-p.w/2,y:p.y-18,width:p.w,height:36,rx:7}),s("text",{x:p.x,y:p.y+5,"text-anchor":"middle"},n.label));
  svg.append(g);
 }
}
const facts=xs=>'<div class="facts">'+xs.map(v=>"<span>"+esc(v)+"</span>").join("")+"</div>";
const button=(attr,id,name)=>'<button type="button" data-'+attr+'="'+esc(id)+'">'+esc(name)+'</button>';
const desc=a=>[label(a.site),fmt(a.period)+" bp",fmt(a.span)+" bp",fmt(a.start)+"–"+fmt(a.end)+" bp",Math.round(a.lag_identity*100)+"%"];
function table(headers,rows){
 return "<table><thead><tr>"+headers.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+esc(x)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
}
function show(){
 const dd=get("detail"),n=nodes.get(active),e=edges.find(e=>e.id===activeEdge);
 if(e){
   let out="<h2>"+esc(label(e.source)+" ↔ "+label(e.target))+"</h2><p class='intro'>"+styles[e.layer]+"</p>";
   if(e.layer==="read")out+="<p>"+esc(e.note)+"</p>"+facts([e.spanning_two_distinct_chromosome_ends+" verified between-arm bridges"])+"<div class='mono'>"+e.reads.map(esc).join("<br>")+"</div>";
   if(e.layer==="homology")out+=table([label(e.source),label(e.target),"Orientation","Identity"],e.blocks.map(b=>[fmt(b.start)+"–"+fmt(b.end),fmt(b.target_start)+"–"+fmt(b.target_end),b.orientation==="+"?"Same":"Opposite",(100*b.identity).toFixed(1)+"%"]))+"<p class='intro'>Coordinates start at each outward tip.</p>"+(e.note?"<p class='intro'>"+esc(e.note)+"</p>":"")+""+facts(["0 verified between-arm bridges"]);
   if(e.layer==="array")out+=table(["Site","Period","Span","From tip","Lag identity"],D.arrays.filter(a=>a.site===e.source&&a.group===e.target).map(desc));
   dd.innerHTML=out+"<h3>Inspect</h3><div class='list'>"+[e.source,e.target].map(id=>button("node",id,label(id))).join("")+"</div>";
   return;
 }
 if(!n){
   dd.innerHTML="<h2>Explore the end network</h2><p class='intro'>Select an end or repeat group to inspect its arrays, cap evidence and competing read placements.</p><h3>Largest shared blocks</h3><div class='list'>"+
     edges.filter(e=>e.layer==="homology").sort((a,b)=>b.blocks[0].matches-a.blocks[0].matches).slice(0,6).map(e=>button("edge",e.id,label(e.source)+" ↔ "+label(e.target)+" · "+fmt(e.blocks[0].matches)+" matching bases")).join("")+"</div>";
   return;
 }
 const track=n.kind==="group"?[]:n.arrays.map(id=>arrays.get(id));
 let out="<h2>"+esc(n.label)+"</h2>";
 if(n.kind==="group"){
  out+=facts([n.sites.length+" sites",n.cap_count+" assigned or provisional caps nearby"])+table(["Site","Period","Span","From tip","Lag identity"],n.arrays.map(id=>desc(arrays.get(id))));
 }else{
  out+=facts([statuses[n.status],n.delta?(n.delta>0?"+":"")+fmt(n.delta)+" bp":"Frozen end retained",n.telomere_repeats?fmt(n.telomere_repeats)+" exact telomeric copies":"No terminal tract"]);
  out+="<p class='wrap'>"+esc(n.note)+"</p>";
  if(n.read||n.family)out+="<div class='mono'>"+[n.family,n.read].filter(Boolean).map(esc).join("<br>")+"</div>";
  const ticks=(n.assigned?["<i class='cap' style='left:0;width:"+Math.min(100,100*(n.telomere_repeats*6+n.offset)/n.length)+"%'></i>"]:[]).concat(track.map(a=>"<i style='left:"+100*a.start/n.length+"%;width:"+100*a.span/n.length+"%'></i>"));
  out+="<h3>Surveyed end sequence</h3><div class='track' aria-hidden='true'>"+ticks.join("")+"</div><div class='scale'><span>Tip</span><span>"+fmt(n.length)+" bp inward</span></div>";
  if(track.length)out+=table(["Site","Period","Span","From tip","Lag identity"],track.map(desc));
  else out+="<p class='intro'>The tandem screen did not return an array in this window.</p>";
 }
 const related=edges.filter(e=>e.source===n.id||e.target===n.id);
 if(related.length)out+="<h3>Connections</h3><div class='list'>"+related.map(e=>button("edge",e.id,styles[e.layer]+" · "+label(e.source===n.id?e.target:e.source))).join("")+"</div>";
 dd.innerHTML=out;
}
function choose(n,e){active=n;activeEdge=e;select.value=n;draw();show()}
function act(t){
 const c=t.closest("[data-node],[data-edge]");
 if(!c)return;
 if(c.dataset.node)choose(c.dataset.node,"");else choose("",c.dataset.edge);
}
document.addEventListener("click",e=>act(e.target));
get("network").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act(e.target)}});
for(const v of Object.keys(styles))get(v).addEventListener("change",draw);
select.addEventListener("change",()=>choose(select.value,""));
get("clear").addEventListener("click",()=>choose("",""));
choose("","");
</script>
</body>
